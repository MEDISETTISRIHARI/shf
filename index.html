<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHF - Job Website Manager</title>

    <script>
      // Restore GitHub Pages SPA routes after a 404 redirect
      (function () {
        var search = window.location.search

        if (search.length > 1 && search[1] === '/') {
          var decodedPath = search
            .slice(1)
            .split('&')
            .map(function (part) {
              return part.replace(/~and~/g, '&')
            })
            .join('?')

          window.history.replaceState(
            null,
            null,
            window.location.pathname.replace(/\/$/, '') +
              decodedPath +
              window.location.hash
          )
        }
      })()
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
